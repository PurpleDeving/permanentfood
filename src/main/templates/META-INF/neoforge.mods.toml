# NeoForge mod metadata (TOML v0.5)
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# Optional metadata keys (uncomment and fill in if you want them)
# issueTrackerURL="..."

[[mixins]]
config="${mod_id}.mixins.json"

# [[accessTransformers]]
# file="META-INF/accesstransformer.cfg"

# --- SolExtended (loads first) -------------------------------------------------
[[mods]]
modId="${api_mod_id}"
version="${api_version}"
displayName="${api_name}"
description='''
Internal companion mod shipped inside the PermanentFood jar.
'''

[[dependencies.${api_mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${api_mod_id}]]
modId="${fzzy_mod_id}"
type="required"
versionRange="[${fzzy_version},)"
ordering="AFTER"
side="BOTH"

# --- PermanentFood (loads after SolExtended) ----------------------------------
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Example mod description.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${fzzy_mod_id}"
type="required"
versionRange="[${fzzy_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${api_mod_id}"
type="required"
versionRange="[${api_version},)"
ordering="AFTER"
side="BOTH"
