# NeoForge mod metadata (TOML v0.5)
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# Optional metadata keys (uncomment and fill in if you want them)
# issueTrackerURL="..."
# [[mixins]]
# config="<modid>.mixins.json"
# [[accessTransformers]]
# file="META-INF/accesstransformer.cfg"

# --- SolExtended (loads first) -------------------------------------------------
[[mods]]
modId="${solextended_mod_id}"
version="${solextended_version}"
displayName="${solextended_name}"
description='''
Internal companion mod shipped inside the PermanentFood jar.
'''

[[dependencies.${solextended_mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${solextended_mod_id}]]
modId="${fzzy_mod_id}"
type="required"
versionRange="[${fzzy_version},)"
ordering="AFTER"
side="BOTH"

# --- PermanentFood (loads after SolExtended) ----------------------------------
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Example mod description.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${fzzy_mod_id}"
type="required"
versionRange="[${fzzy_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${solextended_mod_id}"
type="required"
versionRange="[${solextended_version},)"
ordering="AFTER"
side="BOTH"
